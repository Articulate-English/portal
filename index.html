<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="Articulate English — hands-on English lessons and learning materials. IELTS, grammar, speaking, business English. Built by one teacher.">
<meta property="og:type" content="website">
<meta property="og:title" content="Articulate English — Learn English the way it's actually spoken">
<meta property="og:description" content="IELTS, grammar, speaking and business English materials. Built by one teacher, for learners everywhere.">
<title>Articulate English — The Ascent</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#05060f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;700&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
<style>
:root{--purple:#8b5cf6;--accent2:#22d3ee;--text-cream:#f4f1ea;--text-dim:rgba(244,241,234,.5);--bg:#000;--mark-ring:rgba(255,255,255,.85)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--text-cream);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}

#scene{position:fixed;inset:0;z-index:2;pointer-events:none}
.room{position:relative}
.sticky{position:sticky;top:0;height:100vh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:10}

/* ── INTRO TYPE ── */
.name-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;opacity:0}
.name-text{font-family:'Roboto Flex',sans-serif;font-size:clamp(3.5rem,10vw,7rem);font-weight:700;color:var(--text-cream);text-transform:uppercase;letter-spacing:.05em}
.name-char{display:inline-block;opacity:0;transform:translateY(20px)}
.title-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:6;opacity:0;transform:translateY(150px)}
.title-role{font-family:'Roboto Flex',sans-serif;font-size:clamp(1.5rem,3.5vw,2.5rem);font-weight:600;color:var(--purple);letter-spacing:.12em;text-transform:uppercase}
.title-slogan{font-family:'Roboto Flex',sans-serif;font-size:clamp(2.4rem,5.6vw,4rem);color:var(--text-cream);letter-spacing:.04em;text-align:center}

/* ── GALLERY ── */
#galleryRoom{position:absolute;inset:0;z-index:30;perspective:1200px;display:flex;align-items:center;justify-content:center}
.card-ring{position:relative;width:100%;height:100%;transform-style:preserve-3d;display:flex;align-items:center;justify-content:center}
.ring-card{position:absolute;left:50%;top:50%;width:420px;height:280px;margin-left:-210px;margin-top:-140px;transform-style:preserve-3d;cursor:pointer}
.ring-card-inner{position:relative;width:100%;height:100%;border-radius:12px;background:#0a0a12;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.35),0 10px 40px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;transition:box-shadow .4s ease}
.ring-card-reflect{position:absolute;top:calc(100% + 150px);left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;background:#000}
.ring-card-reflect img{width:100%;height:100%;object-fit:cover;transform:scaleY(-1);opacity:.55;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 95%);mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 95%)}
.ring-card-front{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;background:#0a0a12}
.ring-card-front img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.ring-card:hover .ring-card-inner{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 3px rgba(160,130,255,.3),0 20px 60px rgba(0,0,0,.6)}

/* card caption */
.card-cap{position:absolute;left:0;right:0;bottom:0;padding:1rem 1.1rem;background:rgba(3,3,10,.9);border-top:1px solid rgba(139,92,246,.32);display:flex;flex-direction:column;gap:.7rem;opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}
.ring-card.is-active .card-cap{opacity:1;transform:none}
.card-cap-top{display:flex;align-items:baseline;justify-content:space-between;gap:.9rem}
.card-cap-title{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:700;line-height:1.25;text-transform:uppercase;letter-spacing:.04em;color:var(--text-cream)}
.card-cap-price{font-family:'Oswald',sans-serif;font-size:1.05rem;color:#c4b5fd;white-space:nowrap}
.card-buy{align-self:flex-start;display:inline-block;background:#c0392b;color:#fff;text-decoration:none;padding:.55rem 1.05rem;border-radius:8px;font-size:1rem;font-weight:600;line-height:1.25;transition:background .2s}
.card-buy:hover{background:#9a3412}
.card-soon{align-self:flex-start;font-size:1rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)}

.gallery-floor{position:fixed;bottom:0;left:0;right:0;height:38vh;z-index:1;opacity:0;pointer-events:none;transition:opacity .8s;background:#000}
.gallery-floor.visible{opacity:1}

/* ── THEME TOGGLE (standalone, top-right) ── */
.theme-toggle{position:fixed;top:1.1rem;right:1.1rem;z-index:60;width:56px;height:30px;border-radius:999px;border:1px solid rgba(139,92,246,.35);background:rgba(139,92,246,.12);cursor:pointer;padding:0}
.theme-toggle::after{content:'';position:absolute;inset:-8px;border-radius:999px}
.theme-toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--purple);transition:transform .38s cubic-bezier(.4,0,.2,1)}
.theme-toggle .ico{position:absolute;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:rgba(244,241,234,.75);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .ico-sun{left:7px}
.theme-toggle .ico-moon{right:7px}

/* ── BUY BUTTONS beneath the cards ── */
.card-actions{position:relative;z-index:20;background:#000;border-top:1px solid rgba(139,92,246,.18);padding:3.4rem 2rem 4.5rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
.buy-btn{display:flex;flex-direction:column;align-items:center;gap:.3rem;min-width:210px;padding:1rem 1.6rem;border-radius:14px;background:#0a0a12;border:1px solid rgba(139,92,246,.28);color:var(--text-cream);text-decoration:none;transition:border-color .25s,transform .25s}
.buy-btn:hover{border-color:var(--purple);transform:translateY(-2px)}
.buy-btn.primary{background:var(--purple);border-color:var(--purple)}
.buy-btn.primary:hover{background:#7c3aed}
.buy-btn.soon{opacity:.78}
.buy-label{font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.buy-amt{font-family:'Oswald',sans-serif;font-size:1.25rem;color:#c4b5fd}
.buy-btn.primary .buy-amt{color:#fff}

/* ── SCROLL ROOM HEIGHTS ── */
.r1h{height:700vh}.r2h{height:900vh}.r3h{height:800vh}.r4h{height:400vh}.r5h{height:120vh}.r6h{height:1400vh}
@media(max-width:768px){.r1h{height:400vh}.r2h{height:900vh}.r3h{height:600vh}.r4h{height:200vh}.r5h{height:80vh}}
@media(max-height:560px){.r6h{height:700vh}}

/* ── LANDSCAPE PROMPT ── */
.landscape-overlay{display:none}
@media(max-width:768px) and (orientation:portrait){
  .landscape-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;text-align:center;padding:2rem}
  .landscape-overlay .lo-icon{font-size:3rem}
  .landscape-overlay h2{font-family:'Oswald',sans-serif;font-size:1.4rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-cream)}
  .landscape-overlay p{font-family:'Inter',sans-serif;font-size:1rem;color:var(--text-dim);max-width:320px;line-height:1.6}
  .landscape-overlay .lo-btn{padding:.7em 2em;border-radius:999px;border:1px solid rgba(139,92,246,.4);background:rgba(139,92,246,.15);color:var(--text-cream);font-family:'Inter',sans-serif;font-weight:600;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;min-height:44px}
}
@media(orientation:portrait){
  .name-text{line-height:1.12;text-align:center}
  .name-text .name-space{display:block}
}
@media(max-width:768px) and (orientation:portrait){
  .r6h{height:280vh}
  #galleryRoom{perspective:none;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
  #galleryRoom::-webkit-scrollbar{display:none}
  .card-ring{width:max-content;min-width:100%;flex-direction:row;align-items:center;gap:18px;transform-style:flat;padding:0 10vw}
  .ring-card{position:relative;left:auto;top:auto;width:80vw;height:53vw;max-width:400px;max-height:270px;margin:0;flex:0 0 auto;scroll-snap-align:center;scroll-snap-stop:always;transform:none!important;opacity:1!important;pointer-events:auto!important;z-index:auto!important}
  .ring-card-reflect{display:none}
}

/* ── LOADER ── */
.loading-screen{display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.label-sm{font-family:'Inter',sans-serif;font-size:.95rem;color:#b794f4;letter-spacing:.12em;text-transform:uppercase;animation:pulseGlow 1.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{opacity:.75}50%{opacity:1}}
.dna-helix{display:flex;align-items:center;justify-content:center;height:140px;position:relative;perspective:400px}
.dna-base{width:12px;height:110px;border-radius:4px;margin:0 14px;position:relative;transform-origin:center center;opacity:.2;filter:blur(2px);background-color:#2d1255;background-image:linear-gradient(to top,#22d3ee 0%,#8b5cf6 40%,#4c1d95 100%);background-size:0% 100%;background-repeat:no-repeat;will-change:transform,opacity,background-size,box-shadow}

/* ── A11Y ── */
.skip-link{position:absolute;top:-100px;left:1rem;z-index:99999;background:var(--purple);color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-weight:600;text-decoration:none;transition:top .3s}
.skip-link:focus{top:1rem}
a:focus-visible,button:focus-visible,[role="button"]:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent2);outline-offset:3px;border-radius:6px}

/* ── LIGHT THEME ── */
html[data-theme="light"]{--bg:#f5f3ff;--text-cream:#171129;--text-dim:rgba(23,17,41,.68);--purple:#7c3aed;--accent2:#0a5a6e;--mark-ring:rgba(23,17,41,.18)}
html[data-theme="light"] body{background:var(--bg);color:var(--text-cream)}
html[data-theme="light"] .ring-card-inner{background:#fff;box-shadow:0 10px 40px rgba(76,29,149,.16)}
html[data-theme="light"] .ring-card-front{background:#fff}
html[data-theme="light"] .ring-card-reflect{background:var(--bg)}
html[data-theme="light"] .gallery-floor{background:var(--bg)}
html[data-theme="light"] .card-cap{background:rgba(255,255,255,.94);border-top-color:rgba(76,29,149,.2)}
html[data-theme="light"] .card-cap-price{color:#5b21b6}
html[data-theme="light"] .card-cap-title{color:var(--text-cream)}
html[data-theme="light"] .theme-toggle{background:rgba(124,58,237,.12);border-color:rgba(124,58,237,.35)}
html[data-theme="light"] .theme-toggle .ico{stroke:rgba(23,17,41,.7)}
html[data-theme="light"] .card-actions{background:var(--bg);border-top-color:rgba(76,29,149,.2)}
html[data-theme="light"] .buy-btn{background:#fff;border-color:rgba(76,29,149,.25)}
html[data-theme="light"] .buy-btn.primary{background:#7c3aed;border-color:#7c3aed}
html[data-theme="light"] .buy-amt{color:#5b21b6}
html[data-theme="light"] .buy-btn.primary .buy-amt{color:#fff}
html[data-theme="light"] .label-sm{color:#6d28d9}
html[data-theme="light"] .dna-base{background-color:#e9e4ff}
html[data-theme="light"] .landscape-overlay{background:rgba(245,243,255,.98)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<a href="#r6" class="skip-link">Skip to content</a>

<div class="landscape-overlay" id="landscapeOverlay">
  <div class="lo-icon">📱</div>
  <h2>Rotate Your Phone</h2>
  <p>This experience is designed for landscape orientation. Please turn your phone sideways for the best view.</p>
  <button class="lo-btn" id="loOkBtn">OK</button>
</div>

<canvas id="scene" aria-hidden="true"></canvas>

<section class="room r1h" id="r1">
  <div class="sticky">
    <div class="loading-screen" id="loader">
      <div class="label-sm">keep scrolling down</div>
      <div class="dna-helix" id="dnaHelix"></div>
    </div>
  </div>
</section>
<section class="room r2h" id="r2" aria-hidden="true"><div class="sticky"></div></section>
<section class="room r3h" id="r3">
  <div class="sticky">
    <div class="name-stage" id="nameStage">
      <h1 class="name-text" id="nameText">Articulate English</h1>
    </div>
  </div>
</section>
<section class="room r4h" id="r4">
  <div class="sticky">
    <div class="title-stage" id="titleStage">
      <div class="title-role" id="roleText">English Lessons</div>
      <div class="title-slogan" id="sloganText">Learn English the way it's actually spoken.</div>
    </div>
  </div>
</section>
<section class="room r5h" id="r5" aria-hidden="true"><div class="sticky"></div></section>
<section class="room r6h" id="r6">
  <div class="sticky">
    <section id="galleryRoom"><div class="card-ring" id="cardRing"></div></section>
  </div>
</section>

<div class="gallery-floor" id="galleryFloor"></div>

<button class="theme-toggle" id="themeToggle" aria-label="Switch colour theme" aria-pressed="false">
  <svg class="ico ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="ico ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <span class="knob"></span>
</button>

<section class="card-actions" id="buyActions">
  <a class="buy-btn" href="#" data-bundle="single-deck"><span class="buy-label">Buy a deck</span><span class="buy-amt">$2.99</span></a>
  <a class="buy-btn" href="#" data-bundle="level-bundle"><span class="buy-label">Buy a level</span><span class="buy-amt">$12.99</span></a>
  <a class="buy-btn primary" href="#" data-bundle="full-library"><span class="buy-label">Get the library</span><span class="buy-amt">$49</span></a>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';

var clamp01=function(v){return Math.max(0,Math.min(1,v));};
var lerp=function(a,b,t){return a+(b-a)*clamp01(t);};
var smoothstep=function(t){t=clamp01(t);return t*t*(3-2*t);};
var DPR=Math.min(window.devicePixelRatio||1,2);
var viewW=window.innerWidth,viewH=window.innerHeight;
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ═══ THEME ═══ */
var themeBtn=document.getElementById('themeToggle');
var rootEl=document.documentElement;
function applyTheme(t){rootEl.setAttribute('data-theme',t);if(themeBtn)themeBtn.setAttribute('aria-pressed',t==='light'?'true':'false');}
var stored=null;try{stored=localStorage.getItem('articulate-theme');}catch(e){}
if(stored==='light'||stored==='dark')applyTheme(stored);
else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)applyTheme('light');
else applyTheme('dark');
if(themeBtn)themeBtn.addEventListener('click',function(){
  var next=rootEl.getAttribute('data-theme')==='light'?'dark':'light';
  applyTheme(next);try{localStorage.setItem('articulate-theme',next);}catch(e){}
});

/* ═══ ROOMS ═══ */
var rooms=['r1','r2','r3','r4','r5','r6'].map(function(id){return document.getElementById(id);});
var roomData=rooms.map(function(el){return{el:el,progress:0,top:0,height:0};});
function cacheRooms(){roomData.forEach(function(r){var rect=r.el.getBoundingClientRect();r.top=rect.top+window.scrollY;r.height=rect.height;});}
cacheRooms();
window.addEventListener('resize',function(){viewW=window.innerWidth;viewH=window.innerHeight;cacheRooms();});

/* ═══ THREE.JS PARTICLE RING (from the portfolio) ═══ */
var renderer,scene3,cam,pts,pGeo,pMat,bgPts,bgGeo,bgMat;
var P_COUNT=200,B_COUNT=250,pPhase,bgPhase;
var mx3=0,my3=0,mtx3=0,mty3=0,projV3=null;

try{
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scene'),antialias:true,alpha:true});
  renderer.setPixelRatio(DPR);
  renderer.setSize(viewW,viewH);
  scene3=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(48,viewW/viewH,.1,1000);
  cam.position.set(0,.8,7);cam.lookAt(0,0,0);

  var P_RING=7;
  pGeo=new THREE.BufferGeometry();
  var pPos=new Float32Array(P_COUNT*3);pPhase=new Float32Array(P_COUNT);
  for(var i=0;i<P_COUNT;i++){
    var a=(i/P_COUNT)*Math.PI*2;
    pPos[i*3]=(Math.random()-.5)*20;pPos[i*3+1]=(Math.random()-.5)*20;pPos[i*3+2]=(Math.random()-.5)*20;
    pPhase[i]=Math.random()*Math.PI*2;
  }
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  var pc=document.createElement('canvas');pc.width=256;pc.height=256;
  var pctx=pc.getContext('2d');
  var pg=pctx.createRadialGradient(128,128,1,128,128,128);
  pg.addColorStop(0,'rgba(34,211,238,1)');pg.addColorStop(0.55,'rgba(34,211,238,1)');
  pg.addColorStop(0.6,'rgba(34,211,238,.95)');pg.addColorStop(0.72,'rgba(56,150,255,.55)');
  pg.addColorStop(0.85,'rgba(60,80,255,.18)');pg.addColorStop(1,'rgba(80,0,255,0)');
  pctx.fillStyle=pg;pctx.fillRect(0,0,256,256);
  pMat=new THREE.PointsMaterial({size:.65,map:new THREE.CanvasTexture(pc),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0,color:0xffffff});
  pGeo.setAttribute('aSize',new THREE.BufferAttribute(new Float32Array(P_COUNT).fill(1),1));
  pMat.onBeforeCompile=function(sh){
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nattribute float aSize;')
      .replace('gl_PointSize = size * ( scale / - mvPosition.z );','gl_PointSize = size * aSize * ( scale / - mvPosition.z );');
  };
  pts=new THREE.Points(pGeo,pMat);pts.scale.set(.01,.01,.01);scene3.add(pts);

  var B_RING=10;
  bgGeo=new THREE.BufferGeometry();
  var bgPos=new Float32Array(B_COUNT*3);bgPhase=new Float32Array(B_COUNT);
  for(var j=0;j<B_COUNT;j++){
    var a2=(j/B_COUNT)*Math.PI*2;
    bgPos[j*3]=(Math.random()-.5)*24;bgPos[j*3+1]=(Math.random()-.5)*24;bgPos[j*3+2]=(Math.random()-.5)*24;
    bgPhase[j]=Math.random()*Math.PI*2;
  }
  bgGeo.setAttribute('position',new THREE.BufferAttribute(bgPos,3));
  var bpc=document.createElement('canvas');bpc.width=256;bpc.height=256;
  var bctx=bpc.getContext('2d');
  var bgg=bctx.createRadialGradient(128,128,1,128,128,128);
  bgg.addColorStop(0,'rgba(200,75,255,1)');bgg.addColorStop(0.55,'rgba(200,75,255,1)');
  bgg.addColorStop(0.6,'rgba(196,70,255,.95)');bgg.addColorStop(0.72,'rgba(178,48,255,.55)');
  bgg.addColorStop(0.85,'rgba(150,20,255,.18)');bgg.addColorStop(1,'rgba(120,0,255,0)');
  bctx.fillStyle=bgg;bctx.fillRect(0,0,256,256);
  bgMat=new THREE.PointsMaterial({size:.7,map:new THREE.CanvasTexture(bpc),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0,color:0xffffff});
  bgGeo.setAttribute('aSize',new THREE.BufferAttribute(new Float32Array(B_COUNT).fill(1),1));
  bgMat.onBeforeCompile=function(sh){
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nattribute float aSize;')
      .replace('gl_PointSize = size * ( scale / - mvPosition.z );','gl_PointSize = size * aSize * ( scale / - mvPosition.z );');
  };
  bgPts=new THREE.Points(bgGeo,bgMat);bgPts.position.z=-2;bgPts.scale.set(.01,.01,.01);scene3.add(bgPts);

  window.addEventListener('mousemove',function(e){mtx3=(e.clientX/viewW)*2-1;mty3=-(e.clientY/viewH)*2+1;},{passive:true});
}catch(e){console.warn('Three.js unavailable:',e);}

function updateParticles(time){
  if(!pts)return;
  mx3+=(mtx3-mx3)*.35;my3+=(mty3-my3)*.35;
  var mag3D=new THREE.Vector3(mx3*28,my3*16,2);
  var orbitRot=roomData[1].progress*Math.PI/4*Math.max(1,(roomData[1].height-viewH)/viewH)+time*.001*.5;
  var rp1=clamp01(roomData[1].progress);
  var ps=lerp(.01,1,smoothstep(rp1));
  var psOp=lerp(.25,1,smoothstep(rp1));
  var illum=rp1>0?(.2+.8*clamp01(rp1*1.4)):0;

  var posArr=pGeo.attributes.position.array;
  for(var i=0;i<P_COUNT;i++){
    var idx=i*3,a=(i/P_COUNT)*Math.PI*2,w=Math.sin(time*.001*.4+pPhase[i])*1,r=7+w*.8;
    posArr[idx]=Math.cos(a+orbitRot)*r;posArr[idx+1]=Math.sin(a*2+orbitRot*0.3)*1.5+w+0.55;posArr[idx+2]=Math.sin(a+orbitRot)*r;
    var dx=posArr[idx]-mag3D.x,dy=posArr[idx+1]-mag3D.y,dz=posArr[idx+2]-mag3D.z;
    var dist=Math.sqrt(dx*dx+dy*dy+dz*dz)+.001,force=Math.min(12/dist,20);
    posArr[idx]+=((dx/dist)*force*.9)*.12;
    posArr[idx+1]+=((dy/dist)*force*.9)*.12;
    posArr[idx+2]+=((dz/dist)*force*.9)*.12;
  }
  pGeo.attributes.position.needsUpdate=true;

  if(!projV3)projV3=new THREE.Vector3();
  var SWELL_R=.22,aSz=pGeo.attributes.aSize.array;
  for(var k=0;k<P_COUNT;k++){
    var idx2=k*3;
    projV3.set(posArr[idx2],posArr[idx2+1],posArr[idx2+2]).project(cam);
    var sdx=projV3.x-mx3,sdy=projV3.y-my3,sd=Math.sqrt(sdx*sdx+sdy*sdy);
    var sw=clamp01(1-sd/SWELL_R);
    aSz[k]=1+2*smoothstep(clamp01((sw-(Math.random()*.4))/.6));
  }
  pGeo.attributes.aSize.needsUpdate=true;
  pMat.size=(.3+Math.abs(Math.sin(time*.001*.6))*.5)*(.6+1.433*illum);
  pMat.opacity=illum*psOp*(.8+Math.abs(Math.sin(time*.001*.6))*.2);

  var bgPosArr=bgGeo.attributes.position.array;
  for(var m=0;m<B_COUNT;m++){
    var idx3=m*3,a3=(m/B_COUNT)*Math.PI*2,w3=Math.sin(time*.001*.4+bgPhase[m])*1,r3=10+w3*.8;
    bgPosArr[idx3]=Math.cos(a3+orbitRot)*r3;bgPosArr[idx3+1]=Math.sin(a3*2+orbitRot*0.3)*1.5+w3+0.55;bgPosArr[idx3+2]=Math.sin(a3+orbitRot)*r3;
    var dx3=bgPosArr[idx3]-mag3D.x,dy3=bgPosArr[idx3+1]-mag3D.y,dz3=bgPosArr[idx3+2]-mag3D.z;
    var dist3=Math.sqrt(dx3*dx3+dy3*dy3+dz3*dz3)+.001,force3=Math.min(14/dist3,18);
    bgPosArr[idx3]+=((dx3/dist3)*force3*.9)*.14;
    bgPosArr[idx3+1]+=((dy3/dist3)*force3*.9)*.14;
    bgPosArr[idx3+2]+=((dz3/dist3)*force3*.9)*.14;
  }
  bgGeo.attributes.position.needsUpdate=true;
  bgMat.size=(.35+Math.abs(Math.sin(time*.001*.525+1.5))*.65)*(.6+1.433*illum);
  bgMat.opacity=illum*psOp*(.7+Math.abs(Math.sin(time*.001*.525+1.5))*.3);
}

/* ═══ TEXT ═══ */
var nameText=document.getElementById('nameText'),nameStage=document.getElementById('nameStage');
var roleText=document.getElementById('roleText'),sloganText=document.getElementById('sloganText'),titleStage=document.getElementById('titleStage');

function splitToChars(el,cls){
  var text=el.textContent;el.textContent='';
  var chars=[];
  text.split('').forEach(function(ch){
    var s=document.createElement('span');
    if(ch===' '&&cls!=='name-char'){s.className=cls;s.textContent=ch;s.style.display='inline';}
    else{s.className=cls+(ch===' '?' name-space':'');s.textContent=ch===' '?'\u00a0':ch;}
    el.appendChild(s);chars.push(s);
  });
  return chars;
}
var nameVPChars=splitToChars(nameText,'name-char');
var roleVPChars=splitToChars(roleText,'vp-char');
var sloganVPChars=splitToChars(sloganText,'vp-char');
var allVPChars=[].concat(nameVPChars,roleVPChars,sloganVPChars);
var nameRevealCount=0;

var TITLE_PAD=40;
function fitName(){
  if(!nameText)return;
  nameText.style.fontSize='';
  var avail=viewW-TITLE_PAD*2,w=nameText.scrollWidth;
  if(w>avail&&w>0){var cur=parseFloat(getComputedStyle(nameText).fontSize);nameText.style.fontSize=(cur*avail/w)+'px';}
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitName);else fitName();
window.addEventListener('resize',fitName);

function revealNameChars(count){
  nameVPChars.forEach(function(c,i){c.style.opacity=i<count?'1':'0';c.style.transform=i<count?'translateY(0)':'translateY(20px)';});
}
var curMX=0,curMY=0,lastMX=-999,lastMY=-999;
window.addEventListener('mousemove',function(e){curMX=e.clientX;curMY=e.clientY;},{passive:true});

function updateAllVP(){
  /* only re-measure when the pointer actually moved (was per-frame layout thrash) */
  if(Math.abs(curMX-lastMX)<2&&Math.abs(curMY-lastMY)<2)return;
  lastMX=curMX;lastMY=curMY;
  allVPChars.forEach(function(c){
    if(!c.offsetParent)return;
    var rect=c.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    var dist=Math.hypot(curMX-cx,curMY-cy),radius=150;
    if(dist<radius){var t=1-dist/radius;c.style.fontVariationSettings="'wght' "+Math.round(400+600*t)+", 'opsz' "+Math.round(9+31*t);}
    else if(c.style.fontVariationSettings!=='')c.style.fontVariationSettings="'wght' 400, 'opsz' 9";
  });
}

/* ═══ GALLERY — sale items only: title + price + buy, on the card ═══ */
/* Add your real Gumroad product URLs here (https://<you>.gumroad.com/l/<id>).
   An empty entry shows an honest "On Gumroad soon" label instead of a dead button. */
var GUMROAD_URLS={
  'ielts-speaking-mastery':'',
  'ielts-writing-essays':'',
  'ielts-slide-decks':'',
  'b1-grammar-lessons':'',
  'b2-grammar-lessons':'',
  'linking-words-collection':'',
  'sliding-in':''
};

var cardData=[
  {name:'IELTS Speaking Mastery',img:'assets/cards/ielts-speaking-portal.webp',price:'$29',slug:'ielts-speaking-mastery'},
  {name:'IELTS Writing & Essays',img:'assets/cards/ielts-writing-essays.webp',price:'$14.99',slug:'ielts-writing-essays'},
  {name:'IELTS Slide Decks',img:'assets/cards/ielts-speaking.webp',price:'$12.99',slug:'ielts-slide-decks'},
  {name:'B1 Grammar Lessons',img:'assets/cards/b1-grammar.webp',price:'$12.99',slug:'b1-grammar-lessons'},
  {name:'B2 Grammar Lessons',img:'assets/cards/b2-grammar.webp',price:'$12.99',slug:'b2-grammar-lessons'},
  {name:'Linking Words B1\u2013C2',img:'assets/cards/linking-words.webp',price:'$6.99',slug:'linking-words-collection'},
  {name:'Speaking: Sliding In',img:'assets/cards/sliding-in.webp',price:'$9.99',slug:'sliding-in'}
];

var $cardRing=document.getElementById('cardRing');

cardData.forEach(function(card){
  var url=GUMROAD_URLS[card.slug]||'';
  var action=url
    ?'<a class="card-buy" href="'+url+'" target="_blank" rel="noopener">Buy on Gumroad</a>'
    :'<span class="card-soon">On Gumroad soon</span>';

  var el=document.createElement('div');
  el.className='ring-card';
  el.innerHTML=
    '<div class="ring-card-inner">'+
      '<div class="ring-card-front">'+
        '<img src="'+card.img+'" alt="'+card.name+'" loading="lazy" decoding="async">'+
      '</div>'+
      '<div class="card-cap">'+
        '<div class="card-cap-top">'+
          '<span class="card-cap-title">'+card.name+'</span>'+
          '<span class="card-cap-price">'+card.price+'</span>'+
        '</div>'+
        action+
      '</div>'+
    '</div>'+
    '<div class="ring-card-reflect" aria-hidden="true">'+
      '<img src="'+card.img+'" alt="" loading="lazy" decoding="async">'+
    '</div>';

  if(url)el.addEventListener('click',function(e){
    if(e.target.closest('a'))return;
    window.open(url,'_blank','noopener');
  });

  el._spring={tx:0,tz:-400,ry:0,sc:1,op:0,vtx:0,vtz:0,vry:0,vsc:0,vop:0};
  $cardRing.appendChild(el);
});

/* ═══ BUY BUTTONS beneath the cards ═══ */
/* Same rule as the cards: paste real Gumroad URLs, or the button honestly
   relabels itself "On Gumroad soon" instead of pointing at a dead link. */
var GUMROAD_BUNDLES={
  'single-deck':'',
  'level-bundle':'',
  'full-library':''
};
document.querySelectorAll('.buy-btn').forEach(function(btn){
  var url=GUMROAD_BUNDLES[btn.getAttribute('data-bundle')]||'';
  if(url){
    btn.setAttribute('href',url);
    btn.setAttribute('target','_blank');
    btn.setAttribute('rel','noopener');
  }else{
    btn.setAttribute('aria-disabled','true');
    btn.classList.add('soon');
    var lbl=btn.querySelector('.buy-label');
    if(lbl)lbl.textContent='On Gumroad soon';
  }
});

/* ═══ DNA LOADER ═══ */
var BASE_COUNT=13,dnaHelix=document.getElementById('dnaHelix'),dnaBases=[],dnaSmooth=null;
for(var bi=0;bi<BASE_COUNT;bi++){var base=document.createElement('div');base.className='dna-base';dnaHelix.appendChild(base);dnaBases.push(base);}

/* ═══ LANDSCAPE PROMPT ═══ */
var landscapeOverlay=document.getElementById('landscapeOverlay'),loDismissed=false;
function checkOrientation(){
  var portraitPhone=window.innerWidth<=768&&window.innerHeight>window.innerWidth;
  if(!portraitPhone)loDismissed=false;
  landscapeOverlay.style.display=(portraitPhone&&!loDismissed)?'flex':'none';
}
checkOrientation();
window.addEventListener('orientationchange',function(){setTimeout(checkOrientation,100);});
var loLastW=window.innerWidth;
window.addEventListener('resize',function(){if(window.innerWidth!==loLastW){loLastW=window.innerWidth;checkOrientation();}});
document.getElementById('loOkBtn').addEventListener('click',function(){loDismissed=true;landscapeOverlay.style.display='none';});

/* ═══ TICK (portfolio loop, 30fps cap) ═══ */
var prevTime=0,lastFrame=0,MIN_MS=1000/30;

function tick(now){
  requestAnimationFrame(tick);
  if(now-lastFrame<MIN_MS)return;
  lastFrame=now;
  var dt=Math.min((now-prevTime)/1000,.1);prevTime=now;if(dt<=0)return;

  if(autoplayActive&&!REDUCED){
    var maxY=document.documentElement.scrollHeight-window.innerHeight;
    var ny=window.scrollY+autoplaySpeed*dt*autoplayDir;
    if(ny>=maxY){ny=maxY;autoplayDir=-1;}
    else if(ny<=0){ny=0;autoplayDir=1;}
    window.scrollTo(0,ny);
  }

  roomData.forEach(function(r){var total=r.height-viewH;r.progress=total<=0?(r.top<=window.scrollY?1:0):clamp01((window.scrollY-r.top)/total);});
  var rp=roomData.map(function(r){return r.progress;});
  var mobilePortrait=viewW<=768&&viewH>viewW;

  var helixP=rp[0],loader=document.getElementById('loader');
  var strandSpan=1/BASE_COUNT,LERP_SPEED=.08;
  if(!dnaSmooth){dnaSmooth=new Float32Array(BASE_COUNT);}
  dnaBases.forEach(function(base,i){
    var targetP=clamp01((helixP-i*strandSpan)/strandSpan);
    dnaSmooth[i]+=(targetP-dnaSmooth[i])*LERP_SPEED;
    var sp=dnaSmooth[i],rotY=helixP*Math.PI*12+(i/BASE_COUNT)*Math.PI*2;
    base.style.transform='rotateY('+(rotY*180/Math.PI)+'deg) rotateX(25deg)';
    base.style.backgroundSize=(smoothstep(sp)*100)+'% 100%';
    base.style.opacity=(.25+smoothstep(sp)*.75).toFixed(3);
    base.style.filter='blur('+((2-smoothstep(sp)*2).toFixed(2))+'px)';
    if(sp>0){var g=smoothstep(sp);base.style.boxShadow='0 0 '+(g*25).toFixed(1)+'px rgba(255,255,255,'+(g*.7).toFixed(2)+'), 0 0 '+(g*55).toFixed(1)+'px rgba(255,255,255,'+(g*.35).toFixed(2)+')';}
    else base.style.boxShadow='none';
  });
  loader.style.opacity=helixP>=.98?'0':'1';

  if(pts){var ps2=lerp(.01,1,smoothstep(rp[1]));pts.scale.set(ps2,ps2,ps2);bgPts.scale.set(ps2,ps2,ps2);}

  if(rp[2]>.01){
    var tComp=1/3,tP=Math.min(1,rp[2]/tComp),target=Math.floor(tP*nameVPChars.length);
    if(target!==nameRevealCount){revealNameChars(target);nameRevealCount=target;}
    var nFade=clamp01((rp[2]-2/3)/(1/3));
    nameStage.style.opacity=(1-smoothstep(nFade)).toFixed(3);
  }else{nameStage.style.opacity='0';nameRevealCount=0;}

  if(rp[3]>.02){
    titleStage.style.opacity='1';
    var tp=Math.min(1,rp[3]/.35);
    roleText.style.opacity=tp;
    sloganText.style.opacity=Math.max(0,Math.min(1,(rp[3]-.2)/.3));
  }else titleStage.style.opacity='0';

  /* r5 — hand off to the gallery: fade the wordmark out, no corner text */
  var shrinkP=rp[4];
  if(shrinkP>0){
    var fadeOut=1-smoothstep(clamp01(shrinkP*1.6));
    nameStage.style.opacity=fadeOut.toFixed(3);
    titleStage.style.opacity=fadeOut.toFixed(3);
  }

  var galP=rp[5],gallery=document.getElementById('galleryRoom'),floor=document.getElementById('galleryFloor');
  if(galP>0){
    gallery.style.opacity='1';gallery.style.visibility='visible';
    floor.classList.add('visible');
    var ringCards=document.querySelectorAll('.ring-card'),total=ringCards.length;
    var sp3=galP*(total-1),activeIdx=Math.max(0,Math.min(total-1,Math.round(sp3)));
    var STIFF=.08,DAMP=.72;
    if(!mobilePortrait){
      ringCards.forEach(function(card,i){
        var dist=i-activeIdx,s=card._spring,tx,tz,ry;
        if(dist===0){tx=0;tz=120;ry=0;}
        else if(dist===-1){tx=-370;tz=-130;ry=32;}
        else if(dist===1){tx=370;tz=-130;ry=-32;}
        else if(dist===-2){tx=-550;tz=-230;ry=42;}
        else if(dist===2){tx=550;tz=-230;ry=-42;}
        else{tx=0;tz=-400;ry=0;}
        var op=(Math.abs(dist)>2)?0:1;
        s.vtx+=(tx-s.tx)*STIFF;s.vtx*=DAMP;s.tx+=s.vtx;
        s.vtz+=(tz-s.tz)*STIFF;s.vtz*=DAMP;s.tz+=s.vtz;
        s.vry+=(ry-s.ry)*STIFF;s.vry*=DAMP;s.ry+=s.vry;
        s.vop+=(op-s.op)*STIFF;s.vop*=DAMP;s.op+=s.vop;
        card.style.transform='translateX('+s.tx.toFixed(1)+'px) translateZ('+s.tz.toFixed(1)+'px) rotateY('+s.ry.toFixed(1)+'deg)';
        card.style.opacity=Math.max(0,Math.min(1,s.op)).toFixed(3);
        card.style.zIndex=dist===0?'100':Math.abs(dist)===1?'50':'30';
        card.style.pointerEvents=s.op>.3?'auto':'none';
        card.classList.toggle('is-active',i===activeIdx);
      });
    }
  }else{
    gallery.style.opacity='0';gallery.style.visibility='hidden';
    floor.classList.remove('visible');
  }

  updateAllVP();
  updateParticles(now);
  if(renderer)renderer.render(scene3,cam);
}

prevTime=performance.now();

var autoplayActive=false,autoplaySpeed=0,autoplayDir=1,autoplayTimer=null;
function armAutoplay(){autoplayTimer=setTimeout(function(){autoplaySpeed=Math.max(50,document.documentElement.scrollHeight/80);autoplayActive=true;},4000);}
function pauseAutoplay(){autoplayActive=false;clearTimeout(autoplayTimer);armAutoplay();}
armAutoplay();
['wheel','touchstart','touchmove','keydown','pointerdown'].forEach(function(ev){window.addEventListener(ev,pauseAutoplay,{passive:true});});

if('scrollRestoration' in history)history.scrollRestoration='manual';
window.scrollTo(0,0);
requestAnimationFrame(tick);
})();
</script>
